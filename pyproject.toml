[project]
name = "sarif-kit"
version = "0.3.0"
description = "Convert native output of scanners/linters that lack SARIF support into valid SARIF 2.1.0 for GitHub Code Scanning."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Sergii S." }]
keywords = ["sarif", "code-scanning", "github", "linter", "converter", "security"]
dependencies = [
    "jsonschema>=4.0",
]

[project.scripts]
sarif-kit = "sarif_kit.cli:main"

[project.urls]
Homepage = "https://github.com/sarif-kit/sarif-kit"
Issues = "https://github.com/sarif-kit/sarif-kit/issues"
Documentation = "https://sarif-kit.github.io/sarif-kit/"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-meta-descriptions-plugin>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarif_kit"]

[tool.hatch.build.targets.wheel.force-include]
"src/sarif_kit/schema/sarif-2.1.0.json" = "sarif_kit/schema/sarif-2.1.0.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

# python-semantic-release cuts releases from conventional commits on master;
# see .github/workflows/release.yml. The build_command stamps the released
# version into the action's image pin and the copy-paste snippets, and
# assets lists those files so they land in the release commit.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
commit_message = "chore: release {version}"
assets = [
    "action.yml",
    "README.md",
    "docs/pip-audit.md",
    "docs/yamllint.md",
    "docs/codespell.md",
    "docs/platformio.md",
    "docs/pylint.md",
]
build_command = '''
sed -i -E "s|(ghcr\.io/sarif-kit/sarif-kit:)[0-9]+\.[0-9]+\.[0-9]+|\1${NEW_VERSION}|" action.yml
sed -i -E "s|(sarif-kit/sarif-kit@v)[0-9]+\.[0-9]+\.[0-9]+|\1${NEW_VERSION}|g" README.md docs/pip-audit.md docs/yamllint.md docs/codespell.md docs/platformio.md docs/pylint.md
'''
