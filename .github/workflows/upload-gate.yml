# End-to-end gate: prove that GitHub Code Scanning actually accepts sarif-kit
# output, since a schema-valid file can still be rejected. Run it manually ("Run
# workflow" in the Actions tab) on a repo with Code Scanning enabled, then look under
# Security > Code scanning for the alert with a clickable README.md:1 link.
#
# The adapters job (Step 3) runs each supported tool against its committed fixture
# input, converts the fresh output with the real CLI, and uploads one SARIF per tool.
# Check each alert for the right title, severity, and a working file/line link.
#
# The merged job (Step 4) checks that a file built by `sarif-kit merge` uploads
# and processes, and that merge still refuses the one combination GitHub will
# not take, two runs sharing an analysis category. Alerts from this job
# duplicate the per-tool ones under a category of their own, which is expected.
name: Upload gate

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  upload-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync
      - name: Build gate SARIF
        run: uv run python scripts/gate_minimal_sarif.py gate.sarif
      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gate.sarif
          category: sarif-kit-gate

  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: pip-audit
            capture: >
              uvx pip-audit -r fixtures/pip-audit/input.requirements.txt
              -f json --disable-pip --no-deps > native.out || true
            extra: --dep-file fixtures/pip-audit/input.requirements.txt
          - tool: yamllint
            capture: uvx yamllint -f parsable fixtures/yamllint/input.yaml > native.out || true
            extra: ""
          - tool: codespell
            capture: uvx codespell fixtures/codespell/input.py > native.out || true
            extra: ""
          # No || true: pio check exits 0 with findings, so a nonzero exit is a real
          # failure. The Tool Manager install lines it prints ahead of the JSON on a
          # fresh runner are part of the test: the adapter must skip them.
          - tool: platformio
            capture: >
              (cd fixtures/platformio/input &&
              uvx platformio check --json-output > "$GITHUB_WORKSPACE/native.out")
            extra: --src-root "$GITHUB_WORKSPACE"
          # No || true either: --exit-zero clears the findings bit mask but still
          # exits 32 on a usage error, so a broken flag fails the step instead of
          # writing an empty file.
          - tool: pylint
            capture: >
              uvx pylint --exit-zero --output-format=json2
              fixtures/pylint/input.py > native.out
            extra: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync
      # The fixture inputs are dirty on purpose, so a run that produces no output means
      # the tool itself failed and the || true swallowed it. Refuse to upload that.
      - name: Run ${{ matrix.tool }} on its fixture input
        run: |
          ${{ matrix.capture }}
          test -s native.out
      - name: Convert to SARIF
        run: >
          uv run sarif-kit convert --tool ${{ matrix.tool }}
          -i native.out -o results.sarif ${{ matrix.extra }}
      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: sarif-kit-${{ matrix.tool }}

  merged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync
      - name: Convert two tools and merge them
        run: |
          uvx yamllint -f parsable fixtures/yamllint/input.yaml > yamllint.out || true
          uvx codespell fixtures/codespell/input.py > codespell.out || true
          test -s yamllint.out
          test -s codespell.out
          uv run sarif-kit convert --tool yamllint -i yamllint.out -o yamllint.sarif
          uv run sarif-kit convert --tool codespell -i codespell.out -o codespell.sarif
          uv run sarif-kit merge -o merged.sarif yamllint.sarif codespell.sarif
          uv run sarif-kit validate merged.sarif
      - name: Upload the merged file to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: merged.sarif
          category: sarif-kit-merged
      # Uploading two runs that share an analysis category fails: "The CodeQL
      # Action does not support uploading multiple SARIF runs with the same
      # category" (checked against Code Scanning on 2026-08-04). merge refuses
      # to build such a file, and this step keeps that true.
      - name: Refuse to merge two runs of the same tool
        run: |
          uvx yamllint -f parsable fixtures/yamllint/input.warnings.yaml > warnings.out || true
          test -s warnings.out
          uv run sarif-kit convert --tool yamllint -i warnings.out -o warnings.sarif
          if uv run sarif-kit merge -o same-tool.sarif yamllint.sarif warnings.sarif; then
            echo "merge accepted two yamllint runs; GitHub would reject that file" >&2
            exit 1
          fi
